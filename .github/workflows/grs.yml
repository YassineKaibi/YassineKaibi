name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats card
        run: |
          mkdir -p profile
          curl -s "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true" \
            -o profile/stats.svg

      - name: Validate SVG
        run: |
          if grep -q "title>Error" profile/stats.svg; then
            cat profile/stats.svg
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update README cards"
            git push
          fi
