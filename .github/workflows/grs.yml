name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cards
        run: |
          mkdir -p profile
          curl -s "https://github-readme-stats-alpha-eight-30.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true" \
            -o profile/stats.svg
          curl -s "https://github-readme-stats-alpha-eight-30.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&theme=transparent&hide_border=true&langs_count=10&layout=compact" \
            -o profile/langs.svg

      - name: Validate SVGs
        run: |
          for f in profile/stats.svg profile/langs.svg; do
            if grep -qi "something went wrong\|title>Error" "$f"; then
              echo "Error in $f:"
              cat "$f"
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update README cards"
            git push
          fi
